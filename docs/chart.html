<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gresham Index — Live History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');</script>
<style>
  :root{
    --bg:#0a1018; --line:#223244; --text:#E8EDF4; --muted:#8A94A6;
    --z0:#0E7A4B; --z1:#22B463; --z2:#7DD957; --z3:#F0C23D; --z4:#7E8AA0; --z5:#F2853F; --z6:#E5484D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--f-disp:'Space Grotesk',system-ui,sans-serif;
        --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
        --f-mono:'IBM Plex Mono',ui-monospace,monospace}
  body{background:var(--bg);color:var(--text);font-family:var(--f-body);
       padding:16px;display:flex;justify-content:center}
  .card{background:linear-gradient(155deg,#152233,#0E1621);border:1px solid var(--line);border-radius:18px;
        padding:20px 20px 14px;max-width:1060px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  html.embed body{padding:0;background:transparent;display:block}
  html.embed .card{max-width:none;box-shadow:none}
  .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .kicker{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500}
  .kicker b{color:var(--text);font-weight:500}   /* same size and weight — colour only */
  .ranges{display:flex;gap:6px;align-items:center}
  .ranges button{font-family:var(--f-body);background:none;border:1px solid var(--line);color:var(--muted);font-size:11px;
                 padding:3px 10px;border-radius:999px;cursor:pointer}
  .ranges button.on{color:var(--text);border-color:#3B4C66;background:#1C2836}
  #wrap{position:relative}
  canvas{width:100%;display:block;touch-action:pan-y}
  #cvo{position:absolute;left:0;top:0;pointer-events:none}
  #yzone,#xzone{position:absolute;display:none;touch-action:none;background:transparent}
  #yzone{cursor:ns-resize} #xzone{cursor:ew-resize}
  #tip{position:absolute;pointer-events:none;background:#0B111Aee;border:1px solid var(--line);border-radius:10px;
       padding:8px 11px;font-size:12.5px;line-height:1.5;display:none;white-space:nowrap;z-index:5}
  #tip .d{font-family:var(--f-mono);color:var(--muted);font-size:11px}
  #tip .p{font-family:var(--f-disp);font-weight:700;font-size:14px}
  #tip .z{font-family:var(--f-body);display:inline-block;margin-top:2px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#0B111A}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
  .legend span{font-family:var(--f-body);font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
  .foot{font-family:var(--f-body);margin-top:8px;font-size:10.5px;color:var(--muted)}
  .foot .mono{font-family:var(--f-mono)}
  .foot b{color:var(--text);font-weight:600}
  #state{padding:60px 0;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="kicker"><b>GRESHAM INDEX</b> — BTC/USD, COLORED BY CYCLE RISK</div>
    <div class="ranges" id="ranges">
      <button data-y="0" class="on">All</button><button data-y="4">4y</button><button data-y="1">1y</button>
    </div>
  </div>
  <div id="wrap">
    <div id="state">loading live data…</div>
    <canvas id="cv" style="display:none"></canvas>
    <canvas id="cvo" style="display:none"></canvas>
    <div id="yzone"></div>
    <div id="xzone"></div>
    <div id="tip"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
"use strict";
const URLS=["https://greshamindex.github.io/gresham-index/history.json",
            "https://raw.githubusercontent.com/greshamindex/gresham-index/main/docs/history.json"];
const BANDS=[
  {lo:0.00,c:"#0E7A4B",n:"Heavy Accumulation", s:"Heavy Accum."},
  {lo:0.15,c:"#22B463",n:"Strong Accumulation",s:"Strong Accum."},
  {lo:0.30,c:"#7DD957",n:"Accumulation",       s:"Accum."},
  {lo:0.50,c:"#F0C23D",n:"Light Accumulation", s:"Light Accum."},
  {lo:0.65,c:"#7E8AA0",n:"Neutral",            s:"Neutral",divider:true},
  {lo:0.75,c:"#F2853F",n:"Distribution",       s:"Distrib."},
  {lo:0.85,c:"#E5484D",n:"Heavy Distribution", s:"Heavy Distrib."}];
function band(r){let b=BANDS[0];for(const x of BANDS){if(r>=x.lo)b=x;}return b;}

const cv=document.getElementById("cv"), cvo=document.getElementById("cvo"), tip=document.getElementById("tip"),
      state=document.getElementById("state"), wrap=document.getElementById("wrap");
const DAY=86400000;

let D=[];                      // {t,d,r,p}
let T_MIN=0,T_MAX=0;
let win={t0:0,t1:0};           // visible time window
let yZoom=1;                   // >1 taller, <1 flatter
let geo=null;                  // plot geometry from last draw
let hoverIdx=null;
const PADL=56,PADR=14,PADT=10,PADB=26;

document.getElementById("legend").innerHTML=
  BANDS.map(b=>`<span><i style="background:${b.c}"></i>${b.n}</span>`).join("");
// Query BOTH sources and keep whichever has the later last date — Pages can
// serve a stale file (or fail to deploy) while raw reflects git immediately.
Promise.all(URLS.map(u =>
  fetch(u + "?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(j => (j && j.series && j.series.length) ? j : null)
    .catch(() => null)
)).then(list => {
  const ok = list.filter(Boolean);
  if(!ok.length) throw new Error("no source");
  ok.sort((a,b) => b.series[b.series.length-1][0].localeCompare(a.series[a.series.length-1][0]));
  return ok[0];
})
  .then(j=>{
    D=j.series.filter(s=>s[0]>="2014-01-01")
      .map(s=>({t:Date.parse(s[0]+"T00:00:00Z"),d:s[0],r:s[1],p:s[2]}));
    if(D.length<100) throw new Error("series too short");
    T_MIN=D[0].t; T_MAX=D[D.length-1].t;
    win={t0:T_MIN,t1:T_MAX};
    const last=D[D.length-1];
    document.getElementById("foot").innerHTML=
      `<b>Live</b> · data through <span class="mono">${last.d}</span> · latest reading <b style="font-family:var(--f-disp)">${last.r.toFixed(3)}</b> — ${band(last.r).n}`+
      ` · daily close, log scale · frozen v1.0.1 rules · Data: CoinMetrics Community (CC BY-NC 4.0)`;
    state.style.display="none"; cv.style.display="block"; document.getElementById("cvo").style.display="block";
    draw();
  }).catch(e=>{ state.textContent="Could not load live data. Please refresh."; });

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function idxAt(t){ let lo=0,hi=D.length-1; while(hi-lo>1){const m=(lo+hi)>>1; D[m].t<t?lo=m:hi=m;} return lo; }
function setWindow(t0,t1){
  let span=clamp(t1-t0, 30*DAY, T_MAX-T_MIN);
  t0=clamp(t0, T_MIN, T_MAX-span);
  win.t0=t0; win.t1=t0+span;
}
function zoomAt(tAnchor,factor){
  const span=clamp((win.t1-win.t0)*factor, 30*DAY, T_MAX-T_MIN);
  const frac=(tAnchor-win.t0)/(win.t1-win.t0);
  setWindow(tAnchor-frac*span, tAnchor-frac*span+span);
}
function clearPresets(){ document.querySelectorAll("#ranges button").forEach(b=>b.classList.remove("on")); }

/* ---------- ticks ---------- */
function genTicks(t0,t1,step){
  const out=[], d0=new Date(t0), YR=365.25*DAY, MO=30.44*DAY;
  if(step.k==="y"){
    const inc=Math.max(1,Math.round(step.ms/YR));
    let y=Math.ceil(d0.getUTCFullYear()/inc)*inc;
    if(Date.UTC(y,0,1)<t0) y+=inc;
    for(;Date.UTC(y,0,1)<=t1;y+=inc) out.push({t:Date.UTC(y,0,1),l:String(y)});
  }else if(step.k==="m"){
    const inc=Math.max(1,Math.round(step.ms/MO));
    let y=d0.getUTCFullYear(), m=Math.ceil(d0.getUTCMonth()/inc)*inc;
    if(m>11){m=0;y++;}
    for(let tt=Date.UTC(y,m,1); tt<=t1;){
      if(tt>=t0){
        const dt=new Date(tt);
        let l=dt.toLocaleDateString("en",{month:"short",timeZone:"UTC"});
        if(dt.getUTCMonth()===0) l+=" "+dt.getUTCFullYear();      // year at each January
        out.push({t:tt,l});
      }
      m+=inc; if(m>11){m-=12;y++;} tt=Date.UTC(y,m,1);
    }
  }else{
    const inc=step.ms;
    for(let tt=Math.ceil(t0/inc)*inc; tt<=t1; tt+=inc){
      const dt=new Date(tt);
      let l=dt.toLocaleDateString("en",{day:"numeric",month:"short",timeZone:"UTC"});
      if(dt.getUTCMonth()===0 && dt.getUTCDate()<=inc/DAY) l+=" "+dt.getUTCFullYear();
      out.push({t:tt,l});
    }
  }
  if(out.length && !/\d{4}/.test(out[0].l)) out[0].l+=" "+new Date(out[0].t).getUTCFullYear();
  return out;
}

// densest step whose MEASURED labels still fit the axis
function xTicks(t0,t1,pxWidth,g){
  const YR=365.25*DAY, MO=30.44*DAY;
  const cand=[{ms:DAY,k:"d"},{ms:2*DAY,k:"d"},{ms:7*DAY,k:"d"},{ms:14*DAY,k:"d"},
              {ms:MO,k:"m"},{ms:3*MO,k:"m"},{ms:6*MO,k:"m"},
              {ms:YR,k:"y"},{ms:2*YR,k:"y"},{ms:5*YR,k:"y"},{ms:10*YR,k:"y"}];
  let best=null;
  for(const s of cand){
    if((t1-t0)/s.ms > 400) continue;                 // skip absurdly dense candidates
    const ticks=genTicks(t0,t1,s);
    if(!ticks.length) continue;
    best=ticks;
    let wSum=0;
    for(const tk of ticks) wSum+=g.measureText(tk.l).width+12;   // real widths, not the worst one
    if(wSum <= pxWidth) return ticks;                            // fits — densest wins
  }
  return best||[];
}

/* ---------- y ticks: nice values for whatever range is visible ---------- */
function yTicks(lo,hi){          // lo/hi are log10 bounds
  const out=[], dec=hi-lo;
  if(dec>=0.95){
    const mults = dec>3.2 ? [1] : dec>1.9 ? [1,3] : [1,2,5];
    for(let e=Math.floor(lo);e<=Math.ceil(hi);e++)
      for(const m of mults){
        const p=m*Math.pow(10,e), L=Math.log10(p);
        if(L>=lo&&L<=hi) out.push(p);
      }
  }else{                          // zoomed into a narrow band — linear nice steps
    const a=Math.pow(10,lo), b=Math.pow(10,hi);
    const raw=(b-a)/5, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
    const stp=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
    for(let p=Math.ceil(a/stp)*stp; p<=b; p+=stp) if(p>0) out.push(p);
  }
  return out;
}
// tracked text — computed manually so letter-spacing is identical across browsers
function trackedWidth(g,txt,track){ let w=0; for(const ch of txt) w+=g.measureText(ch).width+track; return w; }
function trackedText(g,txt,x,y,track){ let cx=x; for(const ch of txt){ g.fillText(ch,cx,y); cx+=g.measureText(ch).width+track; } return cx; }

// permanent wordmark inside the plot — anchored to the viewport, never pans or zooms
function drawWatermark(g,x1,y1,W){
  const size = W<520 ? 11 : 13;
  const track = size*0.06;
  g.save();
  g.font = "500 "+size+"px 'Space Grotesk',system-ui,sans-serif";
  g.textAlign="left"; g.textBaseline="alphabetic";
  const A="GRESHAM", B=" INDEX";
  const wA=trackedWidth(g,A,track), wB=trackedWidth(g,B,track);
  const x = x1 - 16 - (wA+wB), y = y1 - 14;
  g.globalAlpha = 0.45;
  g.fillStyle = "#E8EDF4"; const mid = trackedText(g,A,x,y,track);
  g.fillStyle = "#8A94A6"; trackedText(g,B,mid,y,track);
  g.restore();
}

function fmtPrice(p){
  return "$"+p.toLocaleString("en",{maximumFractionDigits: p<10?2 : p<1000?1 : 0});
}

/* ---------- draw ---------- */
let rafPending=false;
function requestDraw(){ if(rafPending) return; rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false; draw(); }); }

function draw(){
  if(!D.length) return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||wrap.clientWidth;
  const H=Math.round(clamp(W*0.62,300,460));
  // reallocating the canvas buffer is expensive — only do it when the size actually changed
  if(cv.width!==Math.round(W*dpr) || cv.height!==Math.round(H*dpr)){
    cv.style.height=H+"px";  cv.width=Math.round(W*dpr);  cv.height=Math.round(H*dpr);
    cvo.style.height=H+"px"; cvo.width=Math.round(W*dpr); cvo.height=Math.round(H*dpr);
    cvo.style.width="100%";
  }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  const x0=PADL,x1=W-PADR,y0=PADT,y1=H-PADB;

  const ia=Math.max(0,idxAt(win.t0)), ib=Math.min(D.length-1,idxAt(win.t1)+1);
  let pmin=Infinity,pmax=0;
  for(let i=ia;i<=ib;i++){const p=D[i].p; if(p<pmin)pmin=p; if(p>pmax)pmax=p;}
  if(!(pmin<pmax)){pmin=pmin*0.9;pmax=pmax*1.1;}
  let lo=Math.log10(pmin)-0.06, hi=Math.log10(pmax)+0.06;
  const mid=(lo+hi)/2, half=(hi-lo)/2/yZoom;
  lo=mid-half; hi=mid+half;

  const X=t=>x0+(t-win.t0)/(win.t1-win.t0)*(x1-x0);
  const Y=p=>y1-(Math.log10(p)-lo)/(hi-lo)*(y1-y0);
  geo={x0,x1,y0,y1,W,H,ia,ib,X,Y,dpr};
  g.font="10.5px 'Space Grotesk',system-ui,sans-serif"; g.textAlign="right"; g.fillStyle="#8A94A6";
  for(const p of yTicks(lo,hi)){
    const y=Y(p);
    g.strokeStyle="#1C2836"; g.beginPath(); g.moveTo(x0,y); g.lineTo(x1,y); g.stroke();
    g.fillText(fmtPrice(p), x0-7, y+3.5);
  }
  g.textAlign="center";
  for(const tk of xTicks(win.t0,win.t1,x1-x0,g)){
    const x=X(tk.t); if(x<x0-1||x>x1+1) continue;
    g.strokeStyle="#1C2836"; g.beginPath(); g.moveTo(x,y0); g.lineTo(x,y1); g.stroke();
    g.fillText(tk.l,x,H-8);
  }
  // axis affordances
  g.strokeStyle="#243247"; g.lineWidth=1;
  g.beginPath(); g.moveTo(x0,y0); g.lineTo(x0,y1); g.lineTo(x1,y1); g.stroke();

  g.save(); g.beginPath(); g.rect(x0,y0,x1-x0,y1-y0); g.clip();
  drawWatermark(g,x1,y1,W);          // above gridlines, below the data
  const span=(win.t1-win.t0)/DAY;
  g.lineWidth=span>2500?1.6:2.2; g.lineJoin="round"; g.lineCap="round";
  let i=ia;
  while(i<ib){
    const c=band(D[i].r).c;
    g.strokeStyle=c; g.beginPath(); g.moveTo(X(D[i].t),Y(D[i].p));
    let j=i+1;
    while(j<=ib && band(D[j-1].r).c===c){ g.lineTo(X(D[j].t),Y(D[j].p)); j++; }
    g.stroke(); i=j-1;
  }
  g.restore();
  drawOverlay();
  placeZones();
}

// crosshair only — cheap, runs on every mouse move
function drawOverlay(){
  if(!geo) return;
  const o=cvo.getContext("2d");
  o.setTransform(geo.dpr,0,0,geo.dpr,0,0);
  o.clearRect(0,0,geo.W,geo.H);
  if(hoverIdx===null || hoverIdx<geo.ia || hoverIdx>geo.ib) return;
  const v=D[hoverIdx], b=band(v.r), x=geo.X(v.t), y=geo.Y(v.p);
  if(x<geo.x0||x>geo.x1) return;
  o.strokeStyle="#3B4C66"; o.setLineDash([4,4]); o.lineWidth=1;
  o.beginPath(); o.moveTo(x,geo.y0); o.lineTo(x,geo.y1); o.stroke(); o.setLineDash([]);
  o.fillStyle=b.c; o.beginPath(); o.arc(x,y,4.5,0,7); o.fill();
  o.strokeStyle="#0E1520"; o.lineWidth=1.5; o.stroke();
}

/* ---------- tooltip ---------- */
function showTip(clientX){
  if(!geo) return;
  const rect=cv.getBoundingClientRect();
  const t=win.t0+(clientX-rect.left-geo.x0)/(geo.x1-geo.x0)*(win.t1-win.t0);
  let k=idxAt(t); if(k+1<D.length && Math.abs(D[k+1].t-t)<Math.abs(D[k].t-t)) k++;
  k=clamp(k,geo.ia,geo.ib);
  hoverIdx=k; drawOverlay();
  const v=D[k], b=band(v.r);
  const dt=new Date(v.t).toLocaleDateString("en",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
  tip.innerHTML=`<div class="d">${dt}</div><div class="p">$${Math.round(v.p).toLocaleString()}</div>`+
    `<div>Gresham Index <b style="font-family:var(--f-disp)">${v.r.toFixed(3)}</b></div>`+
    `<div class="z" style="${b.divider?`background:none;border:1px solid ${b.c};color:${b.c}`:`background:${b.c}`}">${b.s}</div>`;
  tip.style.display="block";
  const x=geo.X(v.t), tw=tip.offsetWidth;
  tip.style.left=(x+14+tw>geo.W-4? x-tw-14 : x+14)+"px";
  tip.style.top="14px";
}
function hideTip(){ tip.style.display="none"; hoverIdx=null; drawOverlay(); }

/* ---------- axis strips: own their gestures, including vertical touch ----------
   These are real DOM elements with touch-action:none, so a vertical drag on the
   price axis reaches us instead of being claimed by the page as a scroll.        */
const yzone=document.getElementById("yzone"), xzone=document.getElementById("xzone");
function placeZones(){
  if(!geo) return;
  yzone.style.display=xzone.style.display="block";
  yzone.style.left="0px"; yzone.style.top=geo.y0+"px";
  yzone.style.width=geo.x0+"px"; yzone.style.height=(geo.y1-geo.y0)+"px";
  xzone.style.left=geo.x0+"px"; xzone.style.top=geo.y1+"px";
  xzone.style.width=(geo.x1-geo.x0)+"px"; xzone.style.height=(geo.H-geo.y1)+"px";
}
function axisDrag(el,kind){
  let sx=0,sy=0,st0=0,st1=0,syz=1,on=false;
  el.addEventListener("pointerdown",ev=>{
    on=true; sx=ev.clientX; sy=ev.clientY; st0=win.t0; st1=win.t1; syz=yZoom;
    hideTip(); try{el.setPointerCapture(ev.pointerId);}catch(_){}
    ev.preventDefault();
  });
  el.addEventListener("pointermove",ev=>{
    if(!on||!geo) return;
    if(kind==="y"){
      yZoom=clamp(syz*Math.exp(-(ev.clientY-sy)/200),0.25,5);     // drag down = flatter
    }else{
      const f=Math.exp(-(ev.clientX-sx)/200);                      // drag left = more time
      const span=clamp((st1-st0)*f,30*DAY,T_MAX-T_MIN);
      setWindow(st1-span,st1); clearPresets();
    }
    requestDraw(); ev.preventDefault();
  });
  const stop=ev=>{ if(!on) return; on=false; try{el.releasePointerCapture(ev.pointerId);}catch(_){} };
  el.addEventListener("pointerup",stop);
  el.addEventListener("pointercancel",stop);
  el.addEventListener("dblclick",()=>{ if(kind==="y"){ yZoom=1; requestDraw(); } });
}
axisDrag(yzone,"y"); axisDrag(xzone,"x");

/* ---------- chart body: mouse ---------- */
const pan={on:false,x:0,t0:0,t1:0};
cv.style.cursor="grab";
cv.addEventListener("mousemove",ev=>{ if(!pan.on) showTip(ev.clientX); });
cv.addEventListener("mouseleave",()=>{ if(!pan.on) hideTip(); });
cv.addEventListener("mousedown",ev=>{
  pan.on=true; pan.x=ev.clientX; pan.t0=win.t0; pan.t1=win.t1;
  cv.style.cursor="grabbing"; hideTip(); ev.preventDefault();
});
window.addEventListener("mousemove",ev=>{
  if(!pan.on||!geo) return;
  const dt=-(ev.clientX-pan.x)/(geo.x1-geo.x0)*(pan.t1-pan.t0);
  setWindow(pan.t0+dt,pan.t1+dt); clearPresets(); requestDraw();
});
window.addEventListener("mouseup",()=>{ if(pan.on){ pan.on=false; cv.style.cursor="grab"; } });

cv.addEventListener("wheel",ev=>{
  if(!geo) return;
  ev.preventDefault();
  const r=cv.getBoundingClientRect();
  const tAt=win.t0+(ev.clientX-r.left-geo.x0)/(geo.x1-geo.x0)*(win.t1-win.t0);
  zoomAt(clamp(tAt,win.t0,win.t1), ev.deltaY>0?1.18:1/1.18);
  clearPresets(); requestDraw();
},{passive:false});

function resetView(){
  setWindow(T_MIN,T_MAX); yZoom=1; hideTip(); clearPresets();
  document.querySelector('#ranges button[data-y="0"]').classList.add("on");
  requestDraw();
}
cv.addEventListener("dblclick",resetView);

/* ---------- chart body: touch ----------
   Swipe sideways to move through time. Press and hold to summon the readout,
   which then follows your finger without moving the chart (TradingView model).  */
const T={mode:null,x:0,y:0,t0:0,t1:0,timer:null};
let pinch=null, lastTap=0;
function longPressStart(x){
  T.mode="crosshair";
  if(navigator.vibrate) { try{ navigator.vibrate(12); }catch(_){} }
  showTip(x);
}
cv.addEventListener("touchstart",ev=>{
  clearTimeout(T.timer);
  if(ev.touches.length===2){
    const [a,b]=ev.touches;
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
           t0:win.t0,t1:win.t1,cx:(a.clientX+b.clientX)/2};
    T.mode="pinch"; hideTip(); return;
  }
  if(ev.touches.length!==1) return;
  const now=Date.now();
  if(now-lastTap<300){ resetView(); lastTap=0; T.mode=null; return; }   // double-tap resets
  lastTap=now;
  const tc=ev.touches[0];
  T.mode="undecided"; T.x=tc.clientX; T.y=tc.clientY; T.t0=win.t0; T.t1=win.t1;
  T.timer=setTimeout(()=>{ if(T.mode==="undecided") longPressStart(T.x); },330);
},{passive:true});

cv.addEventListener("touchmove",ev=>{
  if(T.mode==="pinch"&&pinch&&ev.touches.length===2){
    const [a,b]=ev.touches;
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const r=cv.getBoundingClientRect();
    const tAt=pinch.t0+(pinch.cx-r.left-geo.x0)/(geo.x1-geo.x0)*(pinch.t1-pinch.t0);
    const span=clamp((pinch.t1-pinch.t0)*(pinch.d/Math.max(d,1)),30*DAY,T_MAX-T_MIN);
    const frac=(tAt-pinch.t0)/(pinch.t1-pinch.t0);
    setWindow(tAt-frac*span,tAt-frac*span+span);
    clearPresets(); requestDraw();
    if(ev.cancelable) ev.preventDefault();
    return;
  }
  if(ev.touches.length!==1||!geo) return;
  const tc=ev.touches[0], dx=tc.clientX-T.x, dy=tc.clientY-T.y;
  if(T.mode==="undecided"){
    if(Math.abs(dx)>10&&Math.abs(dx)>=Math.abs(dy)){ clearTimeout(T.timer); T.mode="pan"; hideTip(); }
    else if(Math.abs(dy)>10){ clearTimeout(T.timer); T.mode="scroll"; return; }  // hand back to the page
    else return;
  }
  if(T.mode==="pan"){
    const dt=-dx/(geo.x1-geo.x0)*(T.t1-T.t0);
    setWindow(T.t0+dt,T.t1+dt); clearPresets(); requestDraw();
    if(ev.cancelable) ev.preventDefault();
  }else if(T.mode==="crosshair"){
    showTip(tc.clientX);                    // readout moves, chart stays put
    if(ev.cancelable) ev.preventDefault();
  }
},{passive:false});

cv.addEventListener("touchend",ev=>{
  clearTimeout(T.timer);
  if(T.mode==="undecided") showTip(T.x);    // a plain tap still places the readout
  if(ev.touches.length===0){ T.mode=null; pinch=null; }
});
cv.addEventListener("touchcancel",()=>{ clearTimeout(T.timer); T.mode=null; pinch=null; });

/* ---------- presets ---------- */
document.getElementById("ranges").addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  clearPresets(); b.classList.add("on");
  const y=+b.dataset.y;
  yZoom=1;
  if(!y) setWindow(T_MIN,T_MAX);
  else setWindow(T_MAX-y*365.25*DAY, T_MAX);
  requestDraw();
});
window.addEventListener("resize",()=>{ if(D.length) requestDraw(); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(D.length) requestDraw(); });
})();
</script>
<script>
(function(){
  var ID="chart";
  function h(){var b=document.body,e=document.documentElement;
    return Math.max(b.scrollHeight,b.offsetHeight,e.scrollHeight,e.offsetHeight);}
  var last=0;
  function post(){var v=h(); if(Math.abs(v-last)<2)return; last=v;
    parent.postMessage({type:"gresham-embed-height",id:ID,height:v},"*");}
  window.addEventListener("load",function(){post();setTimeout(post,300);setTimeout(post,1200);});
  window.addEventListener("resize",post);
  if(window.ResizeObserver){try{new ResizeObserver(post).observe(document.body);}catch(e){}}
  setInterval(post,2000);
})();
</script>
