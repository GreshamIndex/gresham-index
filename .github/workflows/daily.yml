# Gresham Index — daily publisher
# Lives at: .github/workflows/daily.yml
name: Publish Gresham Index

on:
  schedule:
    # GitHub's free scheduler often skips or delays a run, so we attempt hourly
    # through the morning and then every two hours. run_daily.js is idempotent:
    # if today's reading is already published it exits without committing, so
    # the first attempt GitHub actually honours wins and the rest are no-ops.
    # Offset minutes avoid :00, which is GitHub's most congested slot.
    - cron: "17 5,6,7,8,9,10 * * *"   # hourly through the morning (UTC)
    - cron: "17 12,14,16,18 * * *"    # fallbacks through the afternoon
  workflow_dispatch:        # adds a manual "Run workflow" button

permissions:
  contents: write           # allow the workflow to commit the results

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute today's index
        run: node run_daily.js

      - name: Publish (commit results)
        run: |
          git config user.name "gresham-bot"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Gresham Index $(date -u +%F): $(node -e "console.log(require('./docs/latest.json').value)")"
            git push
          fi
