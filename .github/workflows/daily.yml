# Gresham Index — daily publisher
# Lives at: .github/workflows/daily.yml
name: Publish Gresham Index

on:
  schedule:
    # GitHub's free scheduler skips and delays runs, so we attempt often.
    # Every 20 minutes through the morning window, then a few fallbacks.
    # Times are UTC: the morning block covers 06:05-10:45 Bratislava in summer
    # and 05:05-09:45 in winter, so the reading is up before the morning post.
    # Offset minutes avoid :00, which is GitHub's most congested slot.
    - cron: "5,25,45 4,5,6,7,8 * * *"  # morning window, every 20 min (UTC)
    - cron: "17 11,14,17,20 * * *"     # fallbacks if the morning is skipped
  workflow_dispatch:        # adds a manual "Run workflow" button

permissions:
  contents: write           # allow the workflow to commit the results

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute today's index
        run: node run_daily.js

      - name: Publish (commit results)
        run: |
          git config user.name "gresham-bot"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Gresham Index $(date -u +%F): $(node -e "console.log(require('./docs/latest.json').value)")"
            git push
          fi
